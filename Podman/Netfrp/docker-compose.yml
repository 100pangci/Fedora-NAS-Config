# 路径：/home/ywpc/Podman/Netfrp
# 镜像：ghcr.io/natfrp/launcher（SakuraFrp / natfrp launcher）
# 说明：三方 frp 备用入口，host 网络，7102 端口；2026-11-08 实查运行中。
#       token 与远程地址在公开快照中脱敏，恢复时需从本机安全配置填回。
services:
  natfrp-service:
    image: ghcr.io/natfrp/launcher
    container_name: natfrp-service
    network_mode: host
    restart: always
    pull_policy: always

    environment:
      NATFRP_TOKEN: "<REDACTED-填SakuraFrp访问令牌>"
      NATFRP_REMOTE: "<REDACTED-填隧道远程地址>"
      TZ: "Asia/Shanghai"
