services:
  webtop:
    image: lscr.io/linuxserver/webtop:ubuntu-xfce
    container_name: ubuntu-xfce-webtop
    restart: unless-stopped
    # rootless:keep-id 让 容器abc(1000)=宿主ywpc;keep-id 默认会把进程跑成 uid1000,
    # LSIO 需要容器内 root 来初始化(usermod/chown/nginx),故显式 -u 0:0
    userns_mode: "keep-id"
    user: "0:0"
    # 宿主代理(宿主 v2rayN-Web 提供)拼进容器回环,容器内可用 127.0.0.1:1145
    network_mode: "pasta:-T,1145"

    ports:
      - "3000:3000"
      - "3001:3001"

    environment:
      PUID: "1000"
      PGID: "1000"
      TZ: "Asia/Shanghai"
      TITLE: "Ubuntu XFCE Webtop"
      CUSTOM_USER: "admin"
      PASSWORD: "<REDACTED-填实际VNC密码>"
      SELKIES_MANUAL_WIDTH: "1600"
      SELKIES_MANUAL_HEIGHT: "900"

    volumes:
      - ./config:/config:nosuid,nodev
      - ./custom-cont-init.d:/custom-cont-init.d:ro
      - /mnt/New-1:/mnt/New-1:rw,rslave,nosuid,nodev
      - /mnt/New-2:/mnt/New-2:rw,rslave,nosuid,nodev
      - /mnt/Old-1:/mnt/Old-1:rw,rslave,nosuid,nodev
      - /mnt/Old-2:/mnt/Old-2:rw,rslave,nosuid,nodev

    security_opt:
      - label=disable

    devices:
      - /dev/dri:/dev/dri

    group_add:
      - keep-groups

    shm_size: "2g"
