# frpc.toml

serverAddr = "<REDACTED-填写VPS地址>"
serverPort = 7000

[auth]
method = "token"
token = "<REDACTED-填实际token>"

[transport]
proxyURL = "socks5://127.0.0.1:1145"
tls.enable = false
tcpMux = true
heartbeatInterval = 30
heartbeatTimeout = 120

[[proxies]]
name = "syncthing"
type = "tcp"
localIP = "127.0.0.1"
localPort = 8384
remotePort = 8384

[[proxies]]
name = "qbittorrent"
type = "tcp"
localIP = "127.0.0.1"
localPort = 7474
remotePort = 7474

